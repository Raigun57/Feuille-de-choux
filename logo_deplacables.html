<body>

  <div class="logo" id="logo1"></div>
  <div class="logo" id="logo2"></div>
  <div class="logo" id="logo3"></div>
  <div class="logo" id="logo4"></div>

  <script>
    // Rend un élément déplaçable à la souris
    function rendreDeplacable(logo) {
      logo.onmousedown = function(event) {
        let shiftX = event.clientX - logo.getBoundingClientRect().left;
        let shiftY = event.clientY - logo.getBoundingClientRect().top;

        logo.style.zIndex = 1000;
        document.body.append(logo);

        moveAt(event.pageX, event.pageY);

        // Déplace le logo aux coordonnées (pageX, pageY)
        // en prenant en compte le décalage initial
        function moveAt(pageX, pageY) {
          logo.style.left = pageX - shiftX + 'px';
          logo.style.top = pageY - shiftY + 'px';
        }

        function onMouseMove(event) {
          moveAt(event.pageX, event.pageY);
        }

        // déplace le logo à chaque évènement mousemove
        document.addEventListener('mousemove', onMouseMove);

        // dépose le logo, enlève les gestionnaires d'évènements dont on n'a plus besoin
        logo.onmouseup = function() {
          document.removeEventListener('mousemove', onMouseMove);
          logo.onmouseup = null;
        };
      };

      logo.ondragstart = function() {
        return false;
      };
    }

    // Applique la fonction à chacune des 4 logos
    document.querySelectorAll('.logo').forEach(rendreDeplacable);
  </script>

</body>
